[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "echo-flow"
version = "0.1.0"
description = "Synthetic emergency decision-intelligence demonstrator"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3",
  "networkx>=3.3,<4",
  "boto3>=1.35,<2",
  "mangum>=0.19,<1",
  "python-dotenv>=1,<2",
  "defusedxml>=0.7,<1"
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
